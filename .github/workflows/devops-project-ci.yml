# Checks the devops-project folder on every pull request and every push to main that touches it.
# It validates; it never touches AWS or the cluster (infrastructure changes run in AWX).
name: devops-project checks

on:
  pull_request:
    paths:
      - "devops-project/**"
      - ".github/workflows/devops-project-ci.yml"
  push:
    branches: [main]
    paths:
      - "devops-project/**"
      - ".github/workflows/devops-project-ci.yml"

permissions:
  contents: read

concurrency:
  group: devops-project-checks-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: devops-project

jobs:
  terraform:
    name: terraform (${{ matrix.stack }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        stack: [vpc, eks, rds, s3-cloudfront, ecr]
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.10"

      - name: Formatting
        run: terraform fmt -check -diff terraform/${{ matrix.stack }}

      # -backend=false: no state bucket or AWS credentials are needed to validate the code.
      - name: Init (no backend)
        run: terraform -chdir=terraform/${{ matrix.stack }} init -backend=false -input=false

      - name: Validate
        run: terraform -chdir=terraform/${{ matrix.stack }} validate

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4

      # values-dev.yaml leaves the DB host and image tag for you to fill in, and the chart
      # refuses an empty host, so give both a dummy value here.
      - name: Lint
        run: >-
          helm lint helm/spring-boot-backend -f helm/spring-boot-backend/values-dev.yaml
          --set database.host=ci.example.internal --set image.tag=ci

      - name: Render the chart
        run: >-
          helm template backend helm/spring-boot-backend -f helm/spring-boot-backend/values-dev.yaml
          --set database.host=ci.example.internal --set image.tag=ci > "$RUNNER_TEMP/rendered.yaml"

      - name: Check the rendered manifests against the Kubernetes schemas
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz \
            | tar -xz -C "$RUNNER_TEMP" kubeconform
          # Custom resources (ExternalSecret, Application) have no built-in schema: skipped.
          "$RUNNER_TEMP/kubeconform" -strict -ignore-missing-schemas -kubernetes-version 1.31.0 -summary "$RUNNER_TEMP/rendered.yaml"

  ansible:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ansible-core
        run: pip install ansible-core

      # Parses every playbook and the role for each environment. (A syntax check does not run
      # Terraform or need AWS.)
      - name: Syntax check, dev and prod
        run: |
          set -e
          for env in dev prod; do
            for playbook in ansible/playbooks/*.yml; do
              echo "== $env: $playbook"
              ansible-playbook -i "ansible/inventories/$env" "$playbook" --syntax-check
            done
          done

  yaml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install yamllint
        run: pip install yamllint

      # Helm templates are not plain YAML, so only the values files and the rest are linted.
      - name: Lint YAML
        run: >-
          yamllint -d "{extends: relaxed, rules: {line-length: disable}}"
          ansible argocd k8s ci
          helm/spring-boot-backend/values.yaml helm/spring-boot-backend/values-dev.yaml
