kind: Deployment
apiVersion: apps/v1
metadata:
 name: nginx-deployment
 namespace: nginx
spec:
 replicas: 2
 selector:
  matchLabels:
   app: nginx
 template:
  metadata:
   name: nginx-pod
   namespace: nginx
   labels:
    app: nginx
  spec:
   containers:
   - name: nginx-container
     image: nginx:latest
     ports:
     - containerPort: 80
     resources:
      requests:
       cpu: 100m
       memory: 128Mi
      limits:
       cpu: 200m
       memory: 256Mi
     livenessProbe:
      httpGet:
       path: /
       port: 80
     readinessProbe:
      httpGet:
       path: /
       port: 80