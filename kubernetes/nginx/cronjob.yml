kind: CronJob
apiVersion: batch/v1
metadata:
 name: cronjob-demo
 namespace: nginx
spec:
  schedule: "*/2 * * * *"
  jobTemplate:
   spec:
    template:
     metadata:
      name: cronjob-pod
      namespace: nginx
      labels:
       app: cronjob-demo
     spec:
      containers:
      - name: cronjob-container
        image: busybox:latest
        command:
        - sh
        - -c
        - >
          echo "Hello world";
          mkdir -p /backups &&
          mkdir -p /demo-data &&
          cp -r /demo-data /backups &&
          echo "Backup completed successfully!";
        volumeMounts:
        - name: backup-volume
          mountPath: /backups
        - name: data-volume
          mountPath: /demo-data
      restartPolicy: OnFailure
      volumes:
       - name: data-volume
         hostPath:
          path: /demo-data
          type: DirectoryOrCreate
       - name: backup-volume
         hostPath:
          path: /backups
          type: DirectoryOrCreate