kind: DaemonSet
apiVersion: apps/v1
metadata:
 name: nginx-daemonset
 namespace: nginx
spec:
 replicas: 2
 selector:
  matchLabels:
   app: nginx
 template:
  metadata:
   name: nginx-pod
   namespace: nginx
   labels:
    app: nginx
  spec:
   containers:
   - name: nginx-container
     image: nginx:latest
     ports:
     - containerPort: 80