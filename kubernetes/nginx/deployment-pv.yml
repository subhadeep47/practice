kind: Deployment
apiVersion: apps/v1
metadata:
 name: nginx-pv-deployment
 namespace: nginx
spec:
 replicas: 2
 selector:
  matchLabels:
   app: nginx
 template:
  metadata:
   name: nginx-pod
   namespace: nginx
   labels:
    app: nginx
  spec:
   containers:
   - name: nginx-container
     image: nginx:latest
     ports:
     - containerPort: 80
     volumeMounts:
     - name: nginx-pv
       mountPath: /usr/share/nginx/html
   volumes:
   - name: nginx-pv
     persistentVolumeClaim:
      claimName: local-pvc