# Default values for spring-boot-backend.
# Environment-specific overrides live in values-<env>.yaml (e.g. values-dev.yaml).

replicaCount: 1

image:
  # TODO: replace with your registry/repo for the backend image
  repository: your-dockerhub-username/spring-boot-backend
  pullPolicy: IfNotPresent
  # Empty = use the chart appVersion. CI should set an immutable tag (e.g. the git SHA), never "latest".
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  # Annotate with an IAM role ARN here if the pod ever needs AWS access via IRSA.
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

# Run as a non-root user with a locked-down container. The image must run as a
# numeric non-root user (uid 1000 here).
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# Port the Spring Boot app listens on inside the container (server.port).
containerPort: 8080

service:
  type: ClusterIP
  port: 8080

# Ingress needs a controller (e.g. AWS Load Balancer Controller) installed in the cluster.
ingress:
  enabled: false
  # "alb" is the IngressClass created by the AWS Load Balancer Controller.
  className: alb
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    # ip mode sends traffic straight to pod IPs (works with the ClusterIP Service).
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
    alb.ingress.kubernetes.io/healthcheck-path: /actuator/health/readiness
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: "15"
    alb.ingress.kubernetes.io/success-codes: "200"
    alb.ingress.kubernetes.io/target-group-attributes: deregistration_delay.timeout_seconds=30
    # HTTPS (needs an ACM certificate in the same region as the ALB):
    #   alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    #   alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:...
    #   alb.ingress.kubernetes.io/ssl-redirect: "443"
  hosts:
    # Leave host empty to serve on the ALB's own DNS name; set a domain once you have one.
    - host: ""
      paths:
        # Only the API is exposed. /actuator is NOT routed through the load balancer.
        - path: /api
          pathType: Prefix
  tls: []

# Keeps at least minAvailable pods up during node drains and upgrades.
# Leave disabled with a single replica, otherwise node drains block.
podDisruptionBudget:
  enabled: false
  minAvailable: 1

# Gateway API HTTPRoute (requires a Gateway controller).
httpRoute:
  enabled: false
  annotations: {}
  parentRefs:
    - name: gateway
      sectionName: http
  hostnames:
    - chart-example.local
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /headers

# JVM sizing: memory limit is the hard ceiling, MaxRAMPercentage keeps the heap below it.
resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    memory: 1Gi

# Spring Boot Actuator health groups. Requires spring-boot-starter-actuator in the app
# (probe endpoints are enabled automatically when running on Kubernetes).
startupProbe:
  httpGet:
    path: /actuator/health/liveness
    port: http
  periodSeconds: 5
  failureThreshold: 30 # up to 150s for the JVM + Spring context + DB connection to come up
livenessProbe:
  httpGet:
    path: /actuator/health/liveness
    port: http
  periodSeconds: 10
  failureThreshold: 3
readinessProbe:
  httpGet:
    path: /actuator/health/readiness
    port: http
  periodSeconds: 10
  failureThreshold: 3

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

# /tmp must be writable because the root filesystem is read-only (Tomcat uses it).
volumes:
  - name: tmp
    emptyDir: {}

volumeMounts:
  - name: tmp
    mountPath: /tmp

nodeSelector: {}
tolerations: []
affinity: {}

# ---- Application configuration -------------------------------------------------

springProfile: "default"

# Plain environment variables added to the container.
extraEnv:
  JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75.0"

# PostgreSQL connection. Host comes from the RDS stack (terraform output db_endpoint).
database:
  host: ""
  port: 5432
  name: appdb
  # Existing Kubernetes Secret holding the DB credentials. If empty, the secret is named
  # <release fullname>-db (the name the ExternalSecret below creates).
  existingSecret: ""
  secretKeys:
    username: username
    password: password

# Optional: sync the RDS-managed master credentials from AWS Secrets Manager into the
# cluster using External Secrets Operator (must be installed, with a SecretStore configured).
externalSecret:
  enabled: false
  apiVersion: external-secrets.io/v1
  refreshInterval: 1h
  secretStoreName: aws-secrets-manager
  secretStoreKind: ClusterSecretStore
  # Secrets Manager secret name or ARN (terraform output db_master_secret_arn).
  remoteSecretId: ""
