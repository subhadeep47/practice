{{- if .Values.externalSecret.enabled }}
apiVersion: {{ .Values.externalSecret.apiVersion }}
kind: ExternalSecret
metadata:
  name: {{ include "spring-boot-backend.dbSecretName" . }}
  labels:
    {{- include "spring-boot-backend.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecret.secretStoreName }}
    kind: {{ .Values.externalSecret.secretStoreKind }}
  target:
    name: {{ include "spring-boot-backend.dbSecretName" . }}
    creationPolicy: Owner
  data:
    - secretKey: {{ .Values.database.secretKeys.username }}
      remoteRef:
        key: {{ required "externalSecret.remoteSecretId is required when externalSecret.enabled" .Values.externalSecret.remoteSecretId | quote }}
        property: username
    - secretKey: {{ .Values.database.secretKeys.password }}
      remoteRef:
        key: {{ required "externalSecret.remoteSecretId is required when externalSecret.enabled" .Values.externalSecret.remoteSecretId | quote }}
        property: password
{{- end }}
