# Overrides for the dev environment.
# database.host is passed at install time (--set database.host=...), see the README runbook.
replicaCount: 2

springProfile: dev

database:
  name: appdb
  # Secret holding the DB credentials (README step 3: created by hand, or step 3b: synced
  # by External Secrets Operator with --set externalSecret.enabled=true).
  existingSecret: backend-db

externalSecret:
  enabled: false

ingress:
  enabled: true

podDisruptionBudget:
  enabled: true
  minAvailable: 1
