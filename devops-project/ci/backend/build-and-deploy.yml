# Copy this file to the BACKEND repository as .github/workflows/build-and-deploy.yml
# (setup: devops-project/ci/README.md in the devops repository).
#
# Pull request to main : build and test only.
# Push to main         : build and test, push the image to ECR tagged with the git commit,
#                        then write that tag into helm/spring-boot-backend/values-dev.yaml in the
#                        devops repository. Argo CD sees the commit and rolls the new image out.
#
# Assumes a Maven project with a Dockerfile at the repository root. For Gradle, replace the
# test command (and see Dockerfile.example).
name: Backend build and deploy

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# One deployment at a time; a newer push waits instead of racing the commit to the devops repo.
concurrency:
  group: backend-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build and run the tests
        run: mvn -B verify

  build-and-push:
    # Only on a push to main, never for pull requests.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # lets the job ask GitHub for the OIDC token that AWS trusts
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to AWS (OIDC, no stored keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Work out the image name and tag
        id: meta
        run: |
          echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          echo "image=${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # The repository is IMMUTABLE: a tag can be pushed once. The commit SHA is unique.
          tags: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  update-gitops:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Check out the devops repository
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.GITOPS_REPO }}
          ref: main
          token: ${{ secrets.GITOPS_TOKEN }}

      - name: Set the new image tag
        env:
          TAG: ${{ needs.build-and-push.outputs.tag }}
          VALUES: devops-project/helm/spring-boot-backend/values-dev.yaml
        run: |
          yq -i '.image.tag = strenv(TAG)' "$VALUES"
          git diff --stat

      - name: Commit and push
        env:
          TAG: ${{ needs.build-and-push.outputs.tag }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add devops-project/helm/spring-boot-backend/values-dev.yaml
          if git diff --cached --quiet; then
            echo "Tag already ${TAG}, nothing to commit"
            exit 0
          fi
          git commit -m "ci: deploy backend ${TAG} to dev" -m "Source: ${GITHUB_REPOSITORY}@${GITHUB_SHA}"
          # Someone else may have pushed meanwhile: rebase and retry.
          for attempt in 1 2 3; do
            git push origin HEAD:main && exit 0
            git pull --rebase origin main
          done
          echo "Could not push after 3 attempts" >&2
          exit 1
