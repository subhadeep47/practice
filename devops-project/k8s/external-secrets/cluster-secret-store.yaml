# Cluster-wide pointer to AWS Secrets Manager for External Secrets Operator.
# There is deliberately no `auth` section: the operator uses the AWS identity of its own pod.
# That identity is the IAM role created in terraform/rds/external_secrets.tf and attached to the
# service account external-secrets/external-secrets through EKS Pod Identity.
# The name must match externalSecret.secretStoreName in the Helm chart values.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
