# Cluster-wide pointer to AWS Secrets Manager for External Secrets Operator.
# Authenticates with the IRSA service account created in README step 3b
# (eksctl create iamserviceaccount ... --namespace external-secrets --name external-secrets).
# The name must match externalSecret.secretStoreName in the Helm chart values.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
