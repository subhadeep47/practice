---
# Stack: terraform/eks
tf_vars_eks:
  cluster_version: "1.35"   # quoted on purpose; 1.34 leaves standard support on 2 Dec 2026
  cluster_endpoint_public_access: true
  node_instance_types: ["t3.medium"]
  desired_size: 2
  min_size: 1
  max_size: 3
  argocd_chart_version: "10.8.3"
  argocd_server_service_type: ClusterIP   # reach the UI with kubectl port-forward
