---
# Stack: terraform/vpc
tf_vars_vpc:
  vpc_cidr: "10.0.0.0/16"
  availability_zones:
    - "{{ aws_region }}a"
    - "{{ aws_region }}b"
  private_subnet_cidrs: ["10.0.1.0/24", "10.0.2.0/24"]      # EKS nodes, RDS
  public_subnet_cidrs: ["10.0.101.0/24", "10.0.102.0/24"]   # load balancers, NAT
  single_nat_gateway: true   # one shared NAT: cheaper, not resilient to an AZ failure
