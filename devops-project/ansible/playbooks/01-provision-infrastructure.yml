---
# Provision the full stack for ONE environment, in dependency order (see vars/stacks.yml).
# The environment is chosen by the inventory; all values come from
# ansible/inventories/<env>/group_vars.
#
# Run from the devops-project folder:
#   ansible-playbook -i ansible/inventories/dev ansible/playbooks/01-provision-infrastructure.yml -e tf_action=plan
#   ansible-playbook -i ansible/inventories/dev ansible/playbooks/01-provision-infrastructure.yml
#   ansible-playbook -i ansible/inventories/prod ansible/playbooks/01-provision-infrastructure.yml -e confirm_env=prod
# One stack only:
#   ... -e '{"tf_services": ["vpc"]}'
- name: Provision Full-Stack Infrastructure via Terraform
  hosts: localhost
  connection: local
  gather_facts: false

  vars_files:
    - vars/stacks.yml

  vars:
    tf_services: "{{ tf_stack_order }}"

  pre_tasks:
    - name: Require an environment inventory
      ansible.builtin.assert:
        that: env_name is defined
        fail_msg: "No environment loaded. Choose one with -i, e.g. -i ansible/inventories/dev"
        quiet: true

    # Protected environments (require_confirmation: true in their group_vars) must be
    # confirmed explicitly for anything that changes infrastructure.
    - name: Require explicit confirmation for protected environments
      ansible.builtin.assert:
        that: >-
          (tf_action | default('apply')) in ['plan', 'output']
          or not (require_confirmation | default(false) | bool)
          or (confirm_env | default('')) == env_name
        fail_msg: "Environment '{{ env_name }}' is protected. Review a plan first, then re-run with -e confirm_env={{ env_name }}"
        quiet: true

  tasks:
    - name: Run Terraform for each stack in order
      ansible.builtin.include_role:
        name: terraform_runner
      loop: "{{ tf_services }}"
      loop_control:
        loop_var: tf_service
