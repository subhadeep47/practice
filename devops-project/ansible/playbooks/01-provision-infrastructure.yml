---
# Provision the full stack for ONE environment, in dependency order (vars/stacks.yml:
# vpc -> eks -> rds -> s3-cloudfront). The environment is chosen by the inventory; all values
# come from its group_vars (ansible/inventories/<env>/group_vars).
#
# tf_action decides what happens (default plan, which changes nothing):
#   plan   terraform plan for every stack
#   apply  terraform apply for every stack, in order
#
# In AWX: one job template per action ("... plan" with {"tf_action": "plan"}, "... apply" with
# {"tf_action": "apply"}), joined in a workflow with an approval step between them (README).
# CLI equivalent, from the devops-project folder:
#   ansible-playbook -i ansible/inventories/dev ansible/playbooks/01-provision-infrastructure.yml
#   ansible-playbook -i ansible/inventories/dev ansible/playbooks/01-provision-infrastructure.yml -e tf_action=apply
#
# Optional: tf_services (a list, e.g. {"tf_services": ["vpc"]}) limits the run to some stacks.
- name: Provision Full-Stack Infrastructure via Terraform
  hosts: localhost
  connection: local
  gather_facts: false

  vars_files:
    - vars/stacks.yml

  vars:
    tf_services: "{{ tf_stack_order }}"

  pre_tasks:
    - name: Require an environment inventory
      ansible.builtin.assert:
        that: env_name is defined
        fail_msg: "No environment loaded. Select the environment's inventory (AWX) or pass -i ansible/inventories/<env> (CLI)."
        quiet: true

    - name: Require a known action
      ansible.builtin.assert:
        that: (tf_action | default('plan')) in ['plan', 'apply']
        fail_msg: "tf_action must be plan (default) or apply here. Outputs: playbook 02. Destroying: playbook 99."
        quiet: true

  tasks:
    - name: Run Terraform for each stack in order
      ansible.builtin.include_role:
        name: terraform_runner
      loop: "{{ tf_services }}"
      loop_control:
        loop_var: tf_service
