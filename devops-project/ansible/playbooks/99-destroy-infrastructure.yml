---
# Tear ONE environment down, in reverse dependency order.
# Read the README "Tear down" section first. The environment's name must be given as
# destroy_confirmation, as a survey question in AWX or on the CLI:
#   ansible-playbook -i ansible/inventories/dev ansible/playbooks/99-destroy-infrastructure.yml -e destroy_confirmation=dev
# Protected settings still apply: prod has RDS deletion_protection, which must be switched
# off (and applied) before the database can be destroyed.

# Play 1 fails fast when no inventory is loaded.
- name: Check the environment
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Require an environment inventory
      ansible.builtin.assert:
        that: env_name is defined
        fail_msg: "No environment loaded. Select the environment inventory (AWX) or pass -i ansible/inventories/<env> (CLI)."
        quiet: true

- name: Destroy Full-Stack Infrastructure via Terraform
  hosts: localhost
  connection: local
  gather_facts: false

  vars_files:
    - vars/stacks.yml

  vars:
    tf_action: destroy
    tf_services: "{{ tf_stack_order | reverse | list }}"

  pre_tasks:
    - name: Confirm destroy
      ansible.builtin.assert:
        that: (destroy_confirmation | default('')) == env_name
        fail_msg: "This destroys ALL infrastructure of '{{ env_name }}'. Set destroy_confirmation to '{{ env_name }}' to confirm."
        quiet: true

  tasks:
    - name: Destroy each stack in reverse order
      ansible.builtin.include_role:
        name: terraform_runner
      loop: "{{ tf_services }}"
      loop_control:
        loop_var: tf_service
