---
# vars file for terraform_runner: values derived from the inputs, not meant to be overridden.

# Name of the stack's variable dict in group_vars, e.g. vpc -> tf_vars_vpc,
# s3-cloudfront -> tf_vars_s3_cloudfront
tf_stack_vars_name: "tf_vars_{{ tf_service | replace('-', '_') }}"

# Everything Terraform receives for this stack: the values shared by all stacks plus the
# stack's own values. Written to a temporary JSON var file for the run.
tf_stack_vars: "{{ tf_vars_common | combine(vars[tf_stack_vars_name]) }}"

# Remote state location and the role used to reach it, written to a temporary file that is given
# to `terraform init -backend-config=<file>`. One state file per environment and stack. The S3
# backend assumes the same Terraform role as the AWS provider (assume_role is a nested value, so
# it cannot be passed as a simple key=value flag). The file holds no secrets.
tf_backend_config_content: |
  bucket       = "{{ tf_backend.bucket }}"
  key          = "{{ tf_backend.key_prefix }}/{{ tf_service }}/terraform.tfstate"
  region       = "{{ tf_backend.region }}"
  encrypt      = {{ tf_backend.encrypt | default(true) | string | lower }}
  use_lockfile = {{ tf_backend.use_lockfile | default(true) | string | lower }}
  assume_role = {
    role_arn     = "{{ tf_stack_vars.terraform_role_arn }}"
    session_name = "terraform-{{ env_name }}-{{ tf_service }}"
  }
