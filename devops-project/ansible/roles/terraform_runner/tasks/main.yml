# tasks file for terraform_runner
- name: Run Terraform for service -> {{ tf_service }}
  block:
    - name: Initialize Terraform in {{ tf_service }}
      ansible.builtin.command:
        cmd: terraform init
        chdir: "{{ playbook_dir }}/../../terraform/{{ tf_service }}"

    - name: Apply Terraform in {{ tf_service }} for environment {{ target_env }}
      ansible.builtin.command:
        cmd: >
          terraform apply -auto-approve 
          -var-file="environments/{{ target_env }}.tfvars"
        chdir: "{{ playbook_dir }}/../../terraform/{{ tf_service }}"
      register: terraform_apply_result

    - name: Display Terraform output for {{ tf_service }}
      ansible.builtin.debug:
        msg: "{{ terraform_apply_result.stdout }}"

  rescue:
    - name: Fail gracefully if Terraform fails
      ansible.builtin.fail:
        msg: "Terraform execution failed for service: {{ tf_service }}"
